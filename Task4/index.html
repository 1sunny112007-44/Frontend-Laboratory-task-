<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space & Astronauts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #000;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      background-image: radial-gradient(white 1px, transparent 1px),
                        radial-gradient(white 1px, transparent 1px);
      background-size: 50px 50px;
      background-position: 0 0, 25px 25px; /* starry effect */
    }

    .space-heading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 400px;
    }

    .animation-area {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 400px;
      position: relative;
      font-size: 60px; /* emoji size */
    }

    .astronaut {
      position: absolute;
      left: 50px;
      bottom: 150px;
    }

    .laser {
      position: absolute;
      left: 120px;
      bottom: 170px;
      font-size: 40px;
      animation: shoot 2s infinite;
    }

    .alien {
      position: absolute;
      right: 50px;
      bottom: 150px;
    }

    /* Animations */
    @keyframes shoot {
      0% { transform: translateX(0); opacity: 1; }
      70% { transform: translateX(300px); opacity: 1; }
      100% { transform: translateX(300px); opacity: 0; } /* fades on hit */
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">SpaceWorld</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
              data-bs-target="#navbarNav" aria-controls="navbarNav" 
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="content.html">Content</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <div class="container mt-5">
    <div class="row">
      <!-- Left side heading -->
      <div class="col-md-6 space-heading">
        <h1>Space & Astronauts</h1>
      </div>

      <!-- Right side animation -->
      <div class="col-md-6">
        <div class="animation-area">
          <div class="astronaut">👨‍🚀</div>
          <div class="laser">🔥</div>
          <div class="alien">👾</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
